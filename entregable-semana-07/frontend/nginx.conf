# =============================================================================
# nginx.conf - contenedor FRONTEND de Tailo (semana 06).
#
# Un solo servidor que cumple DOS funciones:
#   1) Sirve la SPA de Vue (archivos estaticos compilados por Vite).
#   2) Hace de REVERSE PROXY: reenvia las rutas de API al contenedor 'backend'.
#
# Al vivir el frontend y la API bajo el MISMO origen (la URL del tunel apunta a
# este nginx), el navegador del movil NO dispara la Politica de Mismo Origen ->
# no hay errores de CORS en la demo publica.
#
#   [ movil 4G ] --https--> [ tunel ] --> [ este nginx :80 ]
#                                              |-- /  ....... SPA de Vue
#                                              |-- /chat ... proxy --> backend:8000
# =============================================================================

# 'backend' es el nombre del servicio en docker-compose; el DNS interno de
# Docker lo resuelve a la IP del contenedor del backend.
upstream tailo_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # El audio de voz (webm) que sube el navegador a /transcribe puede pesar
    # varios MB: subimos el limite por defecto de nginx (1 MB).
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (reporte de seguridad B-02, M-03, clickjacking) -
    # Se declaran a nivel de servidor para que TODAS las respuestas (SPA + proxy)
    # las hereden. `always` las incluye tambien en respuestas de error.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;                 # anti-clickjacking
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.google.com/recaptcha/; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://swingtails-api-yz02.onrender.com https://nomenclatorial-gilly-contessa.ngrok-free.dev https://www.google.com/recaptcha/; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    server_tokens off;                                        # oculta version de nginx

    # --- API del agente (reverse proxy) --------------------------------------
    # Cada prefijo que expone FastAPI (health, chat, conversations, transcribe,
    # observability) se reenvia tal cual al contenedor 'backend'.
    location ~ ^/(health|chat|conversations|transcribe|observability) {
        proxy_pass http://tailo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STREAMING (SSE) en /chat/stream: hay que DESACTIVAR el buffer de nginx.
        # Si no, nginx acumula los tokens y los entrega de golpe al final, lo que
        # dispara el Time To First Token (TTFT) percibido. Con buffering off los
        # tokens fluyen uno a uno igual que en local.
        proxy_buffering off;
        proxy_cache off;

        # Respuestas largas del LLM: alargamos los timeouts para no cortar el SSE.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- SPA de Vue ----------------------------------------------------------
    # Cualquier otra ruta devuelve index.html (el enrutado lo hace Vue en el
    # cliente). Sin esto, recargar una sub-ruta daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
